apiVersion: v1
kind: ServiceAccount
metadata:
  name: reporter
  labels:
    app: reporter
    {{- include "lab.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reporter-read
  labels:
    app: reporter
    {{- include "lab.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reporter-read
  labels:
    app: reporter
    {{- include "lab.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: reporter-read
subjects:
  - kind: ServiceAccount
    name: reporter
    namespace: {{ .Release.Namespace }}
